<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        width: 20%;
        height: 20%;
    }
</style>

<body>
    <button onclick="bulb()" id="btn">ON</button>

    <img src="images/off.jpg" alt="" id = 'img' class="main">

</body>
<script>
    var img = document.getElementById('img');
    var btnElement = document.getElementById('btn');

    function bulb(){
        if(btnElement.innerText == 'ON'){
           img.src = 'images/on.jpg'
           btnElement.innerText = 'OFF'  
        }
        else{
           img.src = 'images/off.jpg'
           btnElement.innerText = 'ON'  
        }
    }
</script>

</html>
