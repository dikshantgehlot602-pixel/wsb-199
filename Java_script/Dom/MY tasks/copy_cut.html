<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #output{
            margin-top: 50px;
            border: 1px solid black;
            width: 600px;
        }
    </style>
</head>
<body>
    <!-- <input onkeyup="getvalue(this)"/> -->
     <input onchange="getvalue(this)"/>

    <div id="output"></div>

    <script>
        function getvalue(text){
            document.getElementById('output').innerText = text.value
        }
    </script>



</body>
</html>
