<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            max-width: 500px;
            margin: auto;
            margin-top: 100px;
            display: flex;
            gap: 15px;
        }
        .image{
            flex-basis: 50%;
            margin: auto;
        }
        .image img{
            height: 100%;
            width: 100%;
        }

    </style>
</head>

<body>

    <div class="row">
        <div class="image" onmouseover="imageChanger('images/2.png')"
         onmouseout="imageChanger('images/1.png')">
            <img src="images/1.png" id="image_1">
        </div>
    </div>


    <script>

        function imageChanger(image){
            document.getElementById('image_1').src = image;
        }

    </script>
</body>

</html>
