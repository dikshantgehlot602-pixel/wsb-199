<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
            max-width: 1000px;
            margin: auto;
        }

        .images {
            width: 200px;
            height: 200px;
        }

        .images img {
            width: 100%;
            height: 100%;
        }

        .counter button {
            padding: 4px 13px;
        }

        .counter {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <main>
        <div class="row_1">
            <div class="images">
                <img src="images/1.jpg">
            </div>
            <div>
                product name :
            </div>
            <div>
                price :
            </div>
        </div>

        <div class="counter">
            <button onclick="plus()" id="p"> + </button>
            <button id="btn"> 1 </button>
            <button onclick="minus()" id="m"> - </button>
        </div>
    </main>

</body>
<script>
    var plusButton = document.getElementById('p');
    var minusButton = document.getElementById('m');
    var defaultButton = document.getElementById('btn');

    function minus() {
        value = defaultButton.innerText;

        if (value > 1) {
            value--;
            defaultButton.innerText = value;
        }
    }

    function plus() {
        value = defaultButton.innerText;

        if (value < Infinity) {
            value++;
            defaultButton.innerText = value;
        }
    }
</script>

</html>
