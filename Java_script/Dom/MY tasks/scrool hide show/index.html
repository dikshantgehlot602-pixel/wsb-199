<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            width: 1000px;
            height: 2000px;
            border: 1px solid;
        }
        button{
            padding: 20px;
            position: fixed;
            bottom: 3%;
            right: 50%;
            opacity: 0;
            transition: 0.6s;
        }
    </style>
</head>

<body>
    <div class="main">
    </div>
    <button class="fixed_button">Book Now</button>
</body>
<script>
    const mainElement = document.querySelector('.main');
    const fixedElement = document.querySelector('.fixed_button');

    function toogleeButton(){
        const mainPos = mainElement.getBoundingClientRect();
        if(mainPos.top < -90){
            fixedElement.style.opacity = 1;
        }else{
            fixedElement.style.opacity = 0;
        }
    }

    document.addEventListener('scroll', toogleeButton)


</script>

</html>
