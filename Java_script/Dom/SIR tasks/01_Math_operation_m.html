<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Math Operations </title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        main {
            width: 400px;
            height: auto;
            padding: 10px;
            margin: 50px auto;
            border: 0.1px solid red;
        }
        .field {
            width: 100%;
            height: auto;
            padding: 10px;
            
        }
    </style>
</head>
<body>
    <main>
        <div class="field">
            <label for=""> Number 1 </label>
            <input type="number" id="n1">
        </div>
        <div class="field">
            <label for=""> Operation </label>
            <select name="" id="opr">
                <option value="+"> + </option>
                <option value="-"> - </option>
                <option value="*"> * </option>
                <option value="/"> / </option>
            </select>
        </div>
        <div class="field">
            <label for=""> Number 2 </label>
            <input type="nu" id="n2">
        </div>
        <div class="field">
            <button onclick="cal()"> Result </button>
            <input type="text" id="result">
        </div>
    </main>
</body>
<script>

    let num1Ele = document.getElementById('n1');
    let oprEle = document.getElementById('opr');
    let num2Ele = document.getElementById('n2');
    let outputEle = document.getElementById('result');
    function cal(){
        let num1Value = Number(num1Ele.value)
        let num2Value = Number(num2Ele.value)
        let oprValue  = oprEle.value;
        let output = ''; 
        if(oprValue == '+'){
            output = num1Value + num2Value
        } else if(oprValue == '-'){
            output = num1Value - num2Value
        } else if(oprValue == '*'){
            output = num1Value * num2Value
        } else if(oprValue == '/'){
            output = num1Value / num2Value
        } else{
            output = 'unvalid opr'
        }
        outputEle.value = output;
    }




</script>
</html>
