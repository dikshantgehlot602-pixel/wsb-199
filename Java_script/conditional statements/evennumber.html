<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evennumber</title>


</head>
<body>



    <script>
        var number = prompt('enter your number');
        
        if(number % 2 == 0){
            document.write('<h1>Even number</h1>');
        } else {
            document.write('<h1>not an even number</h1>')
        }
    </script>
</body>
</html>
