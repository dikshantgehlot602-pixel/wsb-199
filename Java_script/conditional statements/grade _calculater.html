<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geade Calculater</title>
</head>
<body>
    

    <script>
        var marks = prompt('enter your marks');

        if(marks >= 90 && marks <= 100){
            document.write('<h1>Grade(A)</h1>')
        } else if(marks >= 80 && marks <= 89){
            document.write('<h1>Grade(B)</h1>')
        } else if (marks >= 70 && marks <= 79){
            document.write('<h1>Grade(C)</h1>')
        } else if (marks >= 60 && marks <= 69){
            document.write('<h1>Grade(D)</h1>')
        } else if (marks < 60 && marks >= 1){
            document.write('<h1>(Fail)</h1>')
        } else{
            document.write('<h1>please write correct marks</h1>')
        }
    </script>
</body>
</html>
