<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd number</title>


</head>
<body>



    <script>
        var number = prompt('enter your number');
        
        if(number % 2 != 0){
            document.write('<h1>odd number</h1>');
        } else {
            document.write('<h1>not an odd number</h1>')
        }
    </script>
</body>
</html>
