<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        var from  = prompt('enter the from (K, C, F)').toUpperCase();
        var to    = prompt('enter the to (K, C, F)').toUpperCase();
        var value = Number(prompt('enter the value'));



        if(from == 'C' && to == 'F'){
            formula = (value * 9/5) + 32;
            document.write(formula);
        } else if(from == 'C' && to == 'K'){
            formula = value + 273.15;  
            document.write(formula); 
        } else if(from == 'F' && to == 'C'){
            formula = (value - 32) * 5/9;  
            document.write(formula);
        } else if(from == 'F' && to == 'K'){
            formula = (value - 32) * 5/9 + 273.15;  
            document.write(formula);
        } else if(from == 'K' && to == 'C'){
            formula = value - 273.15;  
            document.write(formula);
        } else if(from == 'K' && to == 'F'){
            formula = (value - 273.15) * 9/5 + 32;  
            document.write(formula);
        } else {
            document.write('invalid value');
        }




    </script>
</body>
</html>
