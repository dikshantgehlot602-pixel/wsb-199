<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        var usernum = Number(prompt('enter your value'));
        var midvalue = Math.ceil(usernum / 2);

        if (usernum == 2 || usernum == 3) {
            document.write(usernum, 'is a prime number');
        }
        else {

            var is_prime = true

            for (var i = 2; i <= midvalue; i++) {
                if (usernum % i == 0) {
                    console.log(usernum,i);
                    is_prime = false;
                    break
                }
            }

            if (is_prime) {
                document.write(usernum, 'is a prime number');
            }
            else {
                document.write(usernum, 'is  not a prime number');
            }
        }



    </script>
</body>

</html>
