<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        var number = prompt('enter your number');
        var sum = 0;

        for( var i = 1; i <= number; i++ ){
            sum = sum + i;
            console.log(sum);
        }

        document.write('<h1> Total Sum - ' + sum + '</h1>')

    </script>
</body>
</html>
