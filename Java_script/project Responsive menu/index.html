<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            margin-left: 1rem;
        }

        .navbar-links ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar-links li {
            list-style: none;
        }

        .navbar-links li a {
            text-decoration: none;
            color: white;
            padding: 1rem;
            display: block;
        }

        .navbar-links li a:hover {
            background-color: #555;
        }

        .toggle-button {
            position: absolute;
            top: .75rem;
            right: 1rem;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .toggle-button .bar {
            height: 3px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .toggle-button {
                display: flex;
            }

            .navbar-links {
                display: none;
                width: 100%;
            }

            .navbar-links ul {
                width: 100%;
                flex-direction: column;
            }

            .navbar-links ul li {
                text-align: center;
            }

            .navbar-links ul li a {
                padding: .5rem 1rem;
            }

            .navbar-links.active {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="logo">MyWebsite</div>
        
        <button class="toggle-button" aria-label="Toggle menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <div class="navbar-links">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Services</a></li>
            </ul>
        </div>
    </nav>

    <div style="padding: 20px;">
        <h1>Welcome!</h1>
        <p>Click hamburger icon to open menu.</p>
        <p>Click outside menu to close it.</p>
        <p>Click on menu links to navigate (menu stays open).</p>
    </div>

    <script>
        const toggleButton = document.querySelector('.toggle-button');
        const navbarLinks = document.querySelector('.navbar-links');
        const navbar = document.getElementById('navbar');

        // 1. Hamburger click -> Open/Close menu
        toggleButton.addEventListener('click', (e) => {
            e.stopPropagation();
            navbarLinks.classList.toggle('active');
        });

        // 2. Click outside navbar -> Close menu
        document.addEventListener('click', (e) => {
            if (navbarLinks.classList.contains('active') && !navbar.contains(e.target)) {
                navbarLinks.classList.remove('active');
            }
        });

        // 3. Click on menu links -> Do NOTHING (menu stays open)
        // Removed the previous code that was closing menu on link click
    </script>

</body>
</html>
