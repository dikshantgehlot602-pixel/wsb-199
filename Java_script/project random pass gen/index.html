<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        .container {
            background: #0f3460;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 400px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #e94560;
        }

        .result-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        #result {
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            color: #00ff88;
            flex: 1;
        }

        .btn-copy {
            background: #e94560;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            margin-left: 10px;
        }

        .btn-copy:hover {
            background: #ff6b6b;
        }

        .settings {
            margin-bottom: 1.5rem;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
        }

        .setting label {
            font-size: 1rem;
        }

        /* Slider Styling */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #1a1a2e;
            outline: none;
            accent-color: #e94560;
            cursor: pointer;
        }

        .length-value {
            background: #e94560;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #e94560;
        }

        .btn-generate {
            width: 100%;
            padding: 1rem;
            background: #e94560;
            border: none;
            color: white;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-generate:hover {
            background: #ff6b6b;
            transform: scale(1.02);
        }

        .message {
            text-align: center;
            margin-top: 10px;
            color: #00ff88;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .message.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔐 Password Generator</h2>
        
        <!-- Result Display -->
        <div class="result-container">
            <span id="result">Generating...</span>
            <button class="btn-copy" id="copyBtn">Copy</button>
        </div>
        <p class="message" id="message">Password copied!</p>

        <!-- Settings -->
        <div class="settings">
            <!-- Password Length Slider -->
            <div class="setting">
                <label>Password Length</label>
                <div class="slider-container">
                    <input type="range" id="length" min="4" max="30" value="12">
                    <span class="length-value" id="lengthValue">12</span>
                </div>
            </div>

            <!-- Uppercase -->
            <div class="setting">
                <label for="uppercase">Include Uppercase (A-Z)</label>
                <input type="checkbox" id="uppercase" checked>
            </div>

            <!-- Lowercase -->
            <div class="setting">
                <label for="lowercase">Include Lowercase (a-z)</label>
                <input type="checkbox" id="lowercase" checked>
            </div>

            <!-- Numbers -->
            <div class="setting">
                <label for="numbers">Include Numbers (0-9)</label>
                <input type="checkbox" id="numbers" checked>
            </div>

            <!-- Symbols -->
            <div class="setting">
                <label for="symbols">Include Symbols (!@#$%)</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>

        <!-- Generate Button -->
        <button class="btn-generate" id="generateBtn">Generate New Password</button>
    </div>

    <script>
        // DOM Elements
        const resultEl = document.getElementById('result');
        const lengthEl = document.getElementById('length');
        const lengthValueEl = document.getElementById('lengthValue');
        const uppercaseEl = document.getElementById('uppercase');
        const lowercaseEl = document.getElementById('lowercase');
        const numbersEl = document.getElementById('numbers');
        const symbolsEl = document.getElementById('symbols');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const messageEl = document.getElementById('message');

        // Character Sets
        const randomFunc = {
            lower: getRandomLower,
            upper: getRandomUpper,
            number: getRandomNumber,
            symbol: getRandomSymbol
        };

        // Main Generate Function
        function generatePassword() {
            const length = +lengthEl.value;
            const hasLower = lowercaseEl.checked;
            const hasUpper = uppercaseEl.checked;
            const hasNumber = numbersEl.checked;
            const hasSymbol = symbolsEl.checked;

            let generatedPassword = '';
            
            const typesCount = hasLower + hasUpper + hasNumber + hasSymbol;
            const typesArr = [{lower: hasLower}, {upper: hasUpper}, {number: hasNumber}, {symbol: hasSymbol}].filter(
                item => Object.values(item)[0]
            );

            if (typesCount === 0) {
                return 'Select at least 1 option!';
            }

            // Create password
            for (let i = 0; i < length; i += typesCount) {
                typesArr.forEach(type => {
                    const funcName = Object.keys(type)[0];
                    generatedPassword += randomFunc[funcName]();
                });
            }

            // Shuffle the password
            const finalPassword = shuffleString(generatedPassword);
            
            // Trim to exact length
            return finalPassword.slice(0, length);
        }

        // Function to update password on screen
        function updatePassword() {
            resultEl.innerText = generatePassword();
        }

        // Shuffle String Function
        function shuffleString(str) {
            const arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.join('');
        }

        // Generator Functions
        function getRandomLower() {
            return String.fromCharCode(Math.floor(Math.random() * 26) + 97);
        }

        function getRandomUpper() {
            return String.fromCharCode(Math.floor(Math.random() * 26) + 65);
        }

        function getRandomNumber() {
            return String.fromCharCode(Math.floor(Math.random() * 10) + 48);
        }

        function getRandomSymbol() {
            const symbols = '!@#$%^&*(){}[]=<>/,.';
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        // ==========================================
        // EVENT LISTENERS - Real-time Updates
        // ==========================================

        // 1. Slider change - Update password in real-time
        lengthEl.addEventListener('input', (e) => {
            lengthValueEl.textContent = e.target.value;
            updatePassword(); // Password update hoga
        });

        // 2. Checkbox changes - Update password in real-time
        uppercaseEl.addEventListener('change', updatePassword);
        lowercaseEl.addEventListener('change', updatePassword);
        numbersEl.addEventListener('change', updatePassword);
        symbolsEl.addEventListener('change', updatePassword);

        // 3. Generate Button click - Generate new password
        generateBtn.addEventListener('click', updatePassword);

        // 4. Copy Button click - Copy password
        copyBtn.addEventListener('click', () => {
            const password = resultEl.innerText;
            
            if (!password || password === 'Select at least 1 option!') {
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                messageEl.classList.add('show');
                setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 2000);
            });
        });

        // ==========================================
        // INITIAL LOAD - Generate password on page load
        // ==========================================
        updatePassword();

    </script>

</body>
</html>
